<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="fire" cx="50%" cy="92%" r="70%">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.18" stop-color="#ff5a1f"/>
      <stop offset="0.45" stop-color="#9b1408"/>
      <stop offset="0.8" stop-color="#2a0606"/>
      <stop offset="1" stop-color="#0a0608"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="70%">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
    <linearGradient id="metal" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#4a5466"/>
      <stop offset="0.45" stop-color="#1f252f"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262c36"/>
      <stop offset="1" stop-color="#07080b"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9fbff"/>
      <stop offset="0.35" stop-color="#3fe6ff"/>
      <stop offset="1" stop-color="#0a7c99"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a2e"/>
      <stop offset="1" stop-color="#a5400a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff3a1a" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#ff3a1a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff3a1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>

    <clipPath id="helmClip"><path d="M256 70 C350 70 404 134 404 222 C404 290 384 334 352 368 L330 392 L182 392 L160 368 C128 334 108 290 108 222 C108 134 162 70 256 70 Z"/></clipPath>
    <filter id="grime" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.05" numOctaves="4" seed="7"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.03  0 0 0 0 0.025  0 0 0 0 0.02  0 0 0 -2.4 1.4"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.22"/></feComponentTransfer>
    </filter>
    <filter id="smoke" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="4" seed="4"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.10  0 0 0 0 0.08  0 0 0 0 0.08  0 0 0 -1.6 0.95"/>
    </filter>
  </defs>

  <!-- backlight: the city burning -->
  <rect width="512" height="512" fill="url(#fire)"/>

  <circle cx="256" cy="250" r="250" fill="url(#halo)"/>
  <rect width="512" height="512" filter="url(#smoke)" opacity="0.8"/>
  <!-- far horde: silhouettes reaching up against the fire -->
  <g fill="#120609">
    <path d="M-0.6000000000000014 450 C-0.6000000000000014 414.0 6.599999999999998 399.6 21.0 396.0 L40.8 396.0 C55.2 399.6 60.6 414.0 60.6 450 Z M12.899999999999999 383.4 a14.4 16.2 -15 1 0 28.8 0 a14.4 16.2 -15 1 0 -28.8 0 Z M12.899999999999999 403.2 L-3.3000000000000016 343.8 L1.1999999999999993 329.40000000000003 L-6.000000000000002 338.40000000000003 L-7.800000000000002 324.0 L-14.100000000000001 337.5 L-20.400000000000002 327.6 L-15.900000000000002 343.8 L0.29999999999999805 403.2 Z"/>
    <path d="M60.3 446 C60.3 404.0 68.7 387.2 85.5 383.0 L108.6 383.0 C125.4 387.2 131.7 404.0 131.7 446 Z M84.45 368.3 a16.8 18.900000000000002 -15 1 0 33.6 0 a16.8 18.900000000000002 -15 1 0 -33.6 0 Z M115.95 391.4 L134.85 322.1 L129.6 305.3 L138.0 315.8 L140.1 299.0 L147.45 314.75 L154.79999999999998 303.20000000000005 L149.54999999999998 322.1 L130.65 391.4 Z"/>
    <path d="M139.1 456 C139.1 422.0 145.9 408.4 159.5 405.0 L178.2 405.0 C191.8 408.4 196.9 422.0 196.9 456 Z M151.85 393.1 a13.6 15.299999999999999 -15 1 0 27.2 0 a13.6 15.299999999999999 -15 1 0 -27.2 0 Z"/>
    <path d="M323.1 456 C323.1 422.0 329.9 408.4 343.5 405.0 L362.2 405.0 C375.8 408.4 380.9 422.0 380.9 456 Z M342.65 393.1 a13.6 15.299999999999999 -15 1 0 27.2 0 a13.6 15.299999999999999 -15 1 0 -27.2 0 Z"/>
    <path d="M384.3 446 C384.3 404.0 392.7 387.2 409.5 383.0 L432.6 383.0 C449.4 387.2 455.7 404.0 455.7 446 Z M400.05 368.3 a16.8 18.900000000000002 -15 1 0 33.6 0 a16.8 18.900000000000002 -15 1 0 -33.6 0 Z M400.05 391.4 L381.15000000000003 322.1 L386.40000000000003 305.3 L378.0 315.8 L375.90000000000003 299.0 L368.55 314.75 L361.2 303.20000000000005 L366.45 322.1 L385.34999999999997 391.4 Z"/>
    <path d="M455.4 450 C455.4 414.0 462.6 399.6 477.0 396.0 L496.8 396.0 C511.2 399.6 516.6 414.0 516.6 450 Z M476.1 383.4 a14.4 16.2 -15 1 0 28.8 0 a14.4 16.2 -15 1 0 -28.8 0 Z M503.09999999999997 403.2 L519.3000000000001 343.8 L514.8000000000001 329.40000000000003 L522.0 338.40000000000003 L523.8000000000001 324.0 L530.1 337.5 L536.4 327.6 L531.9 343.8 L515.6999999999999 403.2 Z"/>
    <rect x="0" y="440" width="512" height="72"/>
  </g>

  <!-- embers -->
  <g fill="#ffb347">
    <circle cx="64" cy="250" r="2.5"/><circle cx="92" cy="186" r="1.8"/><circle cx="440" cy="214" r="2.4"/>
    <circle cx="470" cy="290" r="1.6"/><circle cx="414" cy="150" r="1.6"/><circle cx="40" cy="330" r="1.8"/>
    <circle cx="120" cy="120" r="1.4"/><circle cx="396" cy="96" r="1.3"/><circle cx="480" cy="360" r="2"/>
  </g>
  <g fill="#ff7a2a" opacity="0.6" filter="url(#soft)">
    <circle cx="64" cy="250" r="6"/><circle cx="440" cy="214" r="6"/><circle cx="480" cy="360" r="5"/>
  </g>

  <!-- shoulders / armor -->
  <path d="M70 512 C78 452 116 418 170 404 L342 404 C396 418 434 452 442 512 Z" fill="url(#metalDark)"/>
  <path d="M96 512 C104 466 132 438 176 426 L214 420 L206 512 Z" fill="url(#armor)"/>
  <path d="M416 512 C408 466 380 438 336 426 L298 420 L306 512 Z" fill="url(#armor)"/>
  <!-- hazard stripes on the shoulder plates -->
  <g fill="#1a0d05" opacity="0.85">
    <path d="M120 512 L150 446 L166 442 L136 512 Z"/><path d="M156 512 L182 436 L196 434 L172 512 Z"/>
    <path d="M392 512 L362 446 L346 442 L376 512 Z"/><path d="M356 512 L330 436 L316 434 L340 512 Z"/>
  </g>
  <!-- neck seal -->
  <path d="M196 380 L316 380 L326 420 L186 420 Z" fill="#0b0d12"/>

  <!-- helmet -->
  <path d="M256 70 C350 70 404 134 404 222 C404 290 384 334 352 368 L330 392 L182 392 L160 368
           C128 334 108 290 108 222 C108 134 162 70 256 70 Z" fill="url(#metal)"/>
  <!-- fire rim light on the helmet's lower edges -->
  <path d="M120 270 C126 318 146 350 182 392" fill="none" stroke="#ff7a2a" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <path d="M392 270 C386 318 366 350 330 392" fill="none" stroke="#ff7a2a" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <!-- cool rim light on top -->
  <path d="M168 104 C204 80 230 74 256 74 C290 74 320 82 346 100" fill="none" stroke="#9fb6d6" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <rect width="512" height="512" filter="url(#grime)" clip-path="url(#helmClip)" opacity="0.55"/>
  <g clip-path="url(#helmClip)" stroke="#a9b4c6" stroke-width="1.6" stroke-linecap="round" opacity="0.55"><path d="M290 305 l22 12" /><path d="M321 357 l9 -0" /><path d="M375 278 l24 -11" /><path d="M249 162 l18 2" /><path d="M128 153 l13 7" /><path d="M328 136 l22 -10" /><path d="M289 127 l8 4" /><path d="M181 152 l26 11" /><path d="M202 369 l18 4" /><path d="M179 363 l20 11" /><path d="M362 177 l15 -6" /><path d="M164 109 l13 2" /><path d="M126 287 l14 -3" /><path d="M342 229 l14 -0" /><path d="M312 107 l26 -15" /><path d="M324 335 l8 3" /><path d="M222 258 l8 -4" /><path d="M173 367 l12 4" /><path d="M371 363 l14 -2" /><path d="M264 315 l10 3" /><path d="M336 339 l9 5" /><path d="M149 189 l19 10" /><path d="M215 358 l18 -4" /><path d="M209 141 l9 -4" /><path d="M308 379 l11 -6" /><path d="M386 245 l15 -5" /></g>
  <!-- hazard crest down the middle -->
  <path d="M236 74 L276 74 L284 176 L228 176 Z" fill="#ff8a1f"/>
  <g fill="#1a0d05"><path d="M236 92 L276 112 L276 126 L234 106 Z"/><path d="M232 128 L280 152 L282 166 L230 142 Z"/></g>

  <g fill="#14100c"><path d="M238 86 l8 -1 l0 7 l-8 -1 z"/><path d="M272 140 l4 2 l-2 7 l-7 -1 z"/><path d="M246 168 l5 2 l2 5 l-8 -2 z"/><path d="M264 100 l5 0 l0 5 l-5 1 z"/><path d="M232 150 l6 -2 l1 8 l-6 2 z"/><path d="M140 470 l7 0 l3 6 l-8 0 z"/><path d="M186 452 l6 0 l1 5 l-5 1 z"/><path d="M372 470 l8 -2 l3 7 l-7 -1 z"/><path d="M330 446 l4 0 l0 8 l-9 2 z"/><path d="M110 500 l6 -3 l0 8 l-5 0 z"/></g>
  <!-- side vents / ear module + antenna -->
  <rect x="100" y="210" width="26" height="74" rx="8" fill="#0b0d12" stroke="#2c3442" stroke-width="3"/>
  <rect x="386" y="210" width="26" height="74" rx="8" fill="#0b0d12" stroke="#2c3442" stroke-width="3"/>
  <path d="M400 214 L432 92" stroke="#0b0d12" stroke-width="8" stroke-linecap="round"/>
  <path d="M400 214 L432 92" stroke="#58657a" stroke-width="3" stroke-linecap="round"/>
  <g fill="none" stroke="#ff2b3d" stroke-linecap="round">
    <path d="M452 70 a26 26 0 0 1 0 36" stroke-width="4" opacity="0.8"/>
    <path d="M466 58 a44 44 0 0 1 0 60" stroke-width="3.5" opacity="0.45"/>
    <path d="M414 70 a26 26 0 0 0 0 36" stroke-width="4" opacity="0.8"/>
    <path d="M400 58 a44 44 0 0 0 0 60" stroke-width="3.5" opacity="0.45"/>
  </g>
  <circle cx="433" cy="88" r="11" fill="#ff2b3d" filter="url(#bloom)"/>
  <circle cx="433" cy="88" r="5" fill="#ffd0d4"/>

  <!-- jaw guard -->
  <path d="M168 300 L344 300 L330 372 C300 388 212 388 182 372 Z" fill="#14181f"/>
  <g stroke="#2e3644" stroke-width="5" stroke-linecap="round">
    <path d="M214 322 L214 360"/><path d="M238 324 L238 366"/><path d="M256 324 L256 368"/><path d="M274 324 L274 366"/><path d="M298 322 L298 360"/>
  </g>

  <!-- visor: angular slit, glowing -->
  <path d="M132 202 L256 240 L380 202 L362 276 C330 294 182 294 150 276 Z" fill="#3fe6ff" filter="url(#bloom)" opacity="0.9"/>
  <path d="M132 202 L256 240 L380 202 L362 276 C330 294 182 294 150 276 Z" fill="url(#visor)"/>
  <path d="M150 220 L256 252 L362 220" fill="none" stroke="#ecfeff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <!-- visor frame -->
  <path d="M132 202 L256 240 L380 202 L362 276 C330 294 182 294 150 276 Z" fill="none" stroke="#0b0d12" stroke-width="8" stroke-linejoin="round"/>
  <!-- crack -->
  <path d="M304 226 L292 248 L308 262 L290 288 M292 248 L270 256 M308 262 L330 270" fill="none" stroke="#0b0d12" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- blood spatter on the helmet -->
  <g fill="#5a0a0f" opacity="0.9">
    <path d="M150 150 c10 -6 22 -2 24 8 c2 10 -10 14 -18 10 c-8 4 -14 -10 -6 -18 z"/>
    <circle cx="182" cy="140" r="4"/><path d="M160 166 q3 0 3 6 l-1 26 q-2 5 -4 0 l-1 -26 q0 -6 3 -6 z"/><path d="M172 162 q2 0 2 5 l-1 14 q-1 4 -3 0 l0 -14 q0 -5 2 -5 z"/><circle cx="140" cy="176" r="3"/><circle cx="190" cy="166" r="2.5"/>
    <path d="M348 312 c6 -4 14 0 14 6 c0 8 -10 10 -14 4 z"/>
  </g>

  <g fill="#4a070c">
    <path d="M300 300 c18 -10 40 -4 46 12 c6 16 -6 26 -20 22 c-6 12 -24 10 -26 -2 c-14 0 -16 -22 0 -32 z"/>
    <path d="M318 330 q4 0 4 8 l-2 34 q-2 6 -4 0 l-2 -34 q0 -8 4 -8 z"/>
    <path d="M336 326 q3 0 3 6 l-1 20 q-2 5 -3 0 l-1 -20 q0 -6 2 -6 z"/>
    <circle cx="352" cy="296" r="4"/><circle cx="290" cy="318" r="3"/>
    <path d="M140 230 c8 -4 14 4 10 10 c-4 6 -12 2 -10 -10 z"/>
  </g>
  <rect width="512" height="512" fill="url(#vignette)"/>
  <rect width="512" height="512" filter="url(#grain)" style="mix-blend-mode:overlay"/>
</svg>
