name: Android app (Google Play)

# Builds the signed .aab to upload to Play Console. Run it from the Actions tab
# ("Run workflow"), then download the "dead-signal-aab" artifact from the finished run.
# ads_live = false uses Google's test ads (closed testing); set it to true for production.
on:
  workflow_dispatch:
    inputs:
      ads_live:
        description: 'Real AdMob ads (true only for the production release)'
        type: boolean
        default: false

permissions:
  contents: write # pushes the signed bundle to the android-builds branch

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the game for the app
        run: npm run build:android
        env:
          ADMOB_LIVE: ${{ inputs.ads_live && '1' || '0' }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME)
      - name: Upload key
        # without the secrets the bundle is still built (unsigned) so the code gets checked
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret not set: building an UNSIGNED bundle (Play won't accept it)"
          fi
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      - name: Version name
        run: echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Build signed bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: upload
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
      - name: Name the bundle
        run: |
          v=$(node -p "require('./package.json').version")
          mv android/app/build/outputs/bundle/release/app-release.aab "dead-signal-$v-${{ github.run_number }}${{ inputs.ads_live && '' || '-testads' }}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: dead-signal-aab
          path: dead-signal-*.aab
          if-no-files-found: error
      - name: Publish the bundle to the android-builds branch
        # a stable download URL (raw.githubusercontent.com) for uploading to Play Console;
        # the branch only ever holds the latest bundles, never source code
        if: env.ANDROID_KEYSTORE_PATH != ''
        run: |
          f=$(ls dead-signal-*.aab)
          mkdir -p /tmp/out && cp "$f" /tmp/out/ && cp "$f" /tmp/out/latest${{ inputs.ads_live && '' || '-testads' }}.aab
          cd /tmp/out
          git init -q -b android-builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Android bundle $f"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-builds
          echo "Bundle: https://raw.githubusercontent.com/${{ github.repository }}/android-builds/$f" >> "$GITHUB_STEP_SUMMARY"
