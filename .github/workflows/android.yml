name: Android app (Google Play)

# Builds the signed .aab to upload to Play Console. Run it from the Actions tab
# ("Run workflow"), then download the "dead-signal-aab" artifact from the finished run.
# ads_live = false uses Google's test ads (closed testing); set it to true for production.
on:
  workflow_dispatch:
    inputs:
      ads_live:
        description: 'Real AdMob ads (true only for the production release)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the game for the app
        run: npm run build:android
        env:
          ADMOB_LIVE: ${{ inputs.ads_live && '1' || '0' }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Upload key
        run: echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      - name: Version name
        run: echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Build signed bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: upload
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
      - name: Name the bundle
        run: |
          v=$(node -p "require('./package.json').version")
          mv android/app/build/outputs/bundle/release/app-release.aab "dead-signal-$v-${{ github.run_number }}${{ inputs.ads_live && '' || '-testads' }}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: dead-signal-aab
          path: dead-signal-*.aab
          if-no-files-found: error
