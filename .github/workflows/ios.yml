name: iOS app (TestFlight / App Store)

# Builds the iPhone app on a GitHub Mac, signs it, and uploads it to App Store Connect, where it
# shows up in TestFlight after Apple's processing (~10-30 min). Run it from the Actions tab.
# Needs repository secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the whole .p8 text).
# ads_live = false uses Google's test ads; true uses the real iOS AdMob app and rewarded unit.
on:
  workflow_dispatch:
    inputs:
      ads_live:
        description: 'Real AdMob ads (true only for the App Store release)'
        type: boolean
        default: false
      distribute_build:
        description: 'Only send this already-uploaded build number to Public Beta (skips building)'
        type: string
        default: ''
      what_to_test:
        description: 'What to Test note for testers (optional)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Newest Xcode on the runner
        run: |
          x=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$x" && xcodebuild -version
      - name: Build the game for the app
        run: npm run build:ios
        env:
          ADMOB_LIVE: ${{ inputs.ads_live && '1' || '0' }}
      - name: Live AdMob app id
        if: ${{ inputs.ads_live }}
        run: /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier ca-app-pub-6900407641110608~7477008563" ios/App/App/Info.plist
      - name: Version
        run: echo "MARKETING_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      - name: Sign, build and upload to TestFlight (fastlane)
        working-directory: ios/App
        run: |
          command -v fastlane >/dev/null || brew install fastlane
          if [ -n "$DISTRIBUTE_BUILD" ]; then fastlane distribute; else fastlane beta; fi
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          BUILD_NUMBER: ${{ github.run_number }}
          DISTRIBUTE_BUILD: ${{ inputs.distribute_build }}
          WHAT_TO_TEST: ${{ inputs.what_to_test || 'Play a few runs! Tell us what felt fun, what felt unfair or too hard, and anything that broke or looked wrong. Ads are test ads in this beta.' }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
      - name: Summary
        run: echo "Uploaded build ${{ github.run_number }}. It appears in TestFlight once Apple finishes processing (~10-30 min)." >> "$GITHUB_STEP_SUMMARY"
